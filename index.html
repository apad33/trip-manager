<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출장 관리</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F8F7F4;--surface:#fff;--surface2:#F2F0EC;
  --border:#E4E0D8;--border2:#D0CCC4;
  --text:#1C1A16;--text2:#6B6560;--text3:#A09A94;
  --blue:#1A6FD4;--blue-bg:#EBF3FD;
  --green:#2E7D32;--green-bg:#E8F5E9;
  --amber:#B45309;--amber-bg:#FEF3C7;
  --red:#C62828;--red-bg:#FFEBEE;
}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;}

/* 로그인 */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:360px;max-width:100%;text-align:center;}
.login-logo{font-size:36px;margin-bottom:12px;}
.login-title{font-size:22px;font-weight:700;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 20px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;font-family:inherit;}
.btn-google:hover{background:var(--surface2);}
.btn-google img{width:20px;height:20px;}

/* 상단바 */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;height:52px;gap:12px;position:sticky;top:0;z-index:100;}
.topbar-logo{font-size:15px;font-weight:700;color:var(--blue);}
.topbar-biz{font-size:12px;color:var(--text3);}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.user-avatar{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);}
.user-name{font-size:12px;color:var(--text2);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sync-badge{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:500;}
.sync-ok{background:var(--green-bg);color:var(--green);}
.sync-ing{background:var(--blue-bg);color:var(--blue);}
.sync-err{background:var(--red-bg);color:var(--red);}

/* 앱 탭 (출장관리 / 운영일정) */
.app-tabs{background:var(--surface);border-bottom:2px solid var(--border);padding:0 20px;display:flex;gap:0;}
.app-tab{padding:12px 24px;font-size:14px;font-weight:600;color:var(--text2);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;margin-bottom:-2px;}
.app-tab.on{color:var(--blue);border-bottom-color:var(--blue);}
.app-tab:hover:not(.on){color:var(--text);}

/* 서브탭 */
.sub-tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;overflow-x:auto;}
.sub-tab{padding:9px 16px;font-size:13px;font-weight:500;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;}
.sub-tab.on{color:var(--text);border-bottom-color:var(--text);}
.sub-tab:hover:not(.on){color:var(--text);}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px;}
.pane{display:none;}.pane.on{display:block;}

/* 공통 컴포넌트 */
.metric-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.mc-lbl{font-size:12px;color:var(--text2);margin-bottom:5px;}
.mc-val{font-size:21px;font-weight:700;}
.mc-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.sec{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin:20px 0 10px;}
.sec:first-child{margin-top:0;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.fg label{font-size:12px;color:var(--text2);font-weight:500;}
.fg input,.fg select,.fg textarea{font-size:13px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);outline:none;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);}
.fg textarea{resize:vertical;min-height:56px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr 1fr;}}
@media(max-width:400px){.grid2,.grid3{grid-template-columns:1fr;}}
.btn{background:var(--text);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.btn:hover{opacity:.85;}
.btn-sm{background:var(--surface);color:var(--text);border:1px solid var(--border2);padding:5px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;}
.btn-sm:hover{background:var(--surface2);}
.btn-red{color:var(--red);border-color:#F9ABAB;}
.btn-red:hover{background:var(--red-bg);}
.btn-blue{color:var(--blue);border-color:#9DC4F5;}
.btn-blue:hover{background:var(--blue-bg);}
.btn-green{color:var(--green);border-color:#86EFAC;}
.btn-green:hover{background:var(--green-bg);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
th{font-weight:600;color:var(--text2);padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:11px;background:var(--surface2);}
td{padding:9px 10px;border-bottom:1px solid #f0f0ee;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;}
tr:hover td{background:var(--surface2);}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap;}
.b-pend{background:#fff3e0;color:#7c4d00;}
.b-done{background:#e8f5e9;color:#1b5e20;}
.b-mine{background:#e3f0fd;color:#0d47a1;}
.b-other{background:#ede7f6;color:#311b92;}
.b-gov{background:#e8f5e9;color:#1b5e20;}
.b-own{background:#fff3e0;color:#7c4d00;}
.b-plan{background:var(--blue-bg);color:var(--blue);}
.b-confirm{background:var(--amber-bg);color:var(--amber);}
.b-sdone{background:var(--green-bg);color:var(--green);}
.b-consult{background:#DCFCE7;color:#166534;}
.b-pr{background:#F3E8FF;color:#7E22CE;}
.b-other2{background:var(--surface2);color:var(--text2);}
.b-bus{background:#DBEAFE;color:#1e40af;}
.bar-wrap{height:7px;background:var(--border);border-radius:4px;margin-top:6px;}
.bar-fill{height:7px;border-radius:4px;transition:width .3s;}
.empty{text-align:center;padding:3rem 0;color:var(--text3);font-size:13px;}
.msg{font-size:12px;margin-left:8px;}
.msg.ok{color:var(--green);}.msg.err{color:var(--red);}
.banner{background:var(--blue-bg);border:1px solid #90c2f7;border-radius:10px;padding:11px 16px;font-size:13px;color:var(--blue);margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.modal-box{background:var(--surface);border-radius:14px;padding:24px;width:520px;max-width:100%;margin:auto;}
.modal-sm{background:var(--surface);border-radius:14px;padding:24px;width:380px;max-width:100%;margin:auto;}
.action-btns{display:flex;gap:5px;}
.progress-bar{height:8px;background:var(--border);border-radius:4px;margin-top:6px;}
.progress-fill{height:8px;border-radius:4px;transition:width .3s;}

/* 달력 */
.cal-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.cal-nav{background:var(--surface);border:1px solid var(--border2);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-family:inherit;}
.cal-nav:hover{background:var(--surface2);}
.cal-title{font-size:18px;font-weight:700;}
.cal-legend{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}
.leg-dot{width:10px;height:10px;border-radius:3px;}
.cal-grid-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:6px 0;}
.cal-dow:first-child{color:#EF4444;}
.cal-dow:last-child{color:#3B82F6;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-height:90px;padding:5px;cursor:pointer;transition:border-color .15s;}
.cal-cell:hover{border-color:var(--blue);}
.cal-cell.today{border-color:var(--blue);background:var(--blue-bg);}
.cal-cell.other-month{opacity:.4;}
.cal-date{font-size:11px;font-weight:600;margin-bottom:3px;}
.cal-cell.is-sun .cal-date{color:#EF4444;}
.cal-cell.is-sat .cal-date{color:#3B82F6;}
.cal-event{font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.cal-more{font-size:10px;color:var(--text3);}
.month-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:20px;}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;}
.month-card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.month-detail-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:3px 0;}
.month-detail-row span:last-child{font-weight:500;color:var(--text);}
.lecturer-item{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.lecturer-item input{font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);outline:none;font-family:inherit;flex:1;}
.time-calc{font-size:12px;color:var(--blue);margin-top:3px;font-weight:500;}
.detail-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.detail-key{color:var(--text2);min-width:80px;font-weight:500;flex-shrink:0;}
.loading-overlay{position:fixed;inset:0;background:rgba(248,247,244,.9);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loading-overlay" class="loading-overlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text2);">불러오는 중...</div>
</div>

<!-- 로그인 -->
<div id="login-screen" class="login-screen" style="display:none;">
  <div class="login-card">
    <div class="login-logo">🚌</div>
    <div class="login-title">출장 관리</div>
    <div class="login-sub">Google 계정으로 로그인하면<br>어디서든 내 데이터를 확인할 수 있어요</div>
    <button class="btn-google" onclick="signIn()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Google로 로그인
    </button>
  </div>
</div>

<!-- 앱 -->
<div id="app-screen" style="display:none;">
  <div class="topbar">
    <div>
      <div class="topbar-logo">🚌 출장 관리</div>
      <div class="topbar-biz" id="topbar-biz"></div>
    </div>
    <div class="topbar-actions">
      <span id="sync-status" class="sync-badge sync-ing">연결 중...</span>
      <img id="user-avatar" class="user-avatar" src="" alt="" style="display:none;">
      <span id="user-name" class="user-name"></span>
      <button class="btn-sm" onclick="signOut()" style="font-size:11px;">로그아웃</button>
    </div>
  </div>

  <!-- 앱 탭 -->
  <div class="app-tabs">
    <button class="app-tab on" onclick="switchApp('trip')">💼 출장 관리</button>
    <button class="app-tab" onclick="switchApp('sched')">📅 운영일정</button>
  </div>

  <!-- ===== 출장 관리 ===== -->
  <div id="app-trip">
    <div class="sub-tabs">
      <button class="sub-tab on" onclick="goTrip('dash')">📊 대시보드</button>
      <button class="sub-tab" onclick="goTrip('monthly')">📅 월별 합계</button>
      <button class="sub-tab" onclick="goTrip('setup')">⚙️ 설정</button>
      <button class="sub-tab" onclick="goTrip('add')">➕ 출장 등록</button>
      <button class="sub-tab" onclick="goTrip('list')">📋 출장 목록</button>
      <button class="sub-tab" onclick="goTrip('settle')">🧾 정산 현황</button>
    </div>
    <div class="wrap">
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:flex-end;">
        <button class="btn-sm" onclick="exportTripCSV()">📥 엑셀</button>
        <button class="btn-sm" onclick="backupTrip()">💾 백업</button>
        <button class="btn-sm" onclick="document.getElementById('loadTripFile').click()">📂 복원</button>
        <input type="file" id="loadTripFile" accept=".json" style="display:none" onchange="loadTripData(event)">
      </div>
      <div id="tp-dash" class="pane on">
        <div id="d-banner"></div>
        <div class="metric-row" id="d-metrics"></div>
        <div class="sec">내 사업 예산 현황</div>
        <div id="d-mybiz"></div>
        <div class="sec" style="margin-top:20px;">미정산 출장</div>
        <div id="d-pend"></div>
      </div>
      <div id="tp-monthly" class="pane">
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
          <select id="m-biz" onchange="renderMonthly()" style="font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;"></select>
          <select id="m-person" onchange="renderMonthly()" style="font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;"><option value="">전체 출장자</option></select>
        </div>
        <div id="monthly-content"></div>
      </div>
      <div id="tp-setup" class="pane">
        <div class="sec">내 사업 설정</div>
        <div class="card">
          <div class="banner"><span>🏢</span><span id="cur-mybiz-text">내 사업 미설정</span></div>
          <div class="grid2" style="margin-bottom:12px;">
            <div class="fg"><label>내 사업명</label><input type="text" id="mb-name" placeholder="사업명 입력"></div>
            <div class="fg"><label>내 이름</label><input type="text" id="mb-owner" placeholder="홍길동"></div>
          </div>
          <div class="fg" style="margin-bottom:12px;"><label>월 예산 한도 (원)</label><input type="number" id="mb-budget" placeholder="예: 500000" min="0" style="max-width:200px;"></div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn" onclick="saveMyBiz()">💾 저장</button>
            <span id="mb-msg" class="msg"></span>
          </div>
        </div>
        <div class="sec">타 사업 등록</div>
        <div class="card">
          <div class="grid2" style="margin-bottom:12px;">
            <div class="fg"><label>사업명</label><input type="text" id="ob-name" placeholder="사업명"></div>
            <div class="fg"><label>담당자</label><input type="text" id="ob-owner" placeholder="담당자명"></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn" onclick="addOtherBiz()">➕ 추가</button>
            <span id="ob-msg" class="msg"></span>
          </div>
        </div>
        <div id="other-biz-list"></div>
      </div>
      <div id="tp-add" class="pane">
        <div class="sec">출장 정보</div>
        <div class="grid2" style="margin-bottom:12px;">
          <div class="fg"><label>출장자 *</label><input type="text" id="a-person" placeholder="홍길동"></div>
          <div class="fg"><label>출장지 *</label><input type="text" id="a-dest" placeholder="서울, 부산 등"></div>
          <div class="fg"><label>출장 시작일 *</label>
            <div style="display:flex;align-items:center;gap:5px;">
              <span style="font-size:13px;font-weight:600;color:var(--text2);background:var(--surface2);padding:8px 11px;border-radius:8px;border:1px solid var(--border2);">2026</span>
              <span style="color:var(--text3);">-</span>
              <input type="text" id="a-start-m" placeholder="MM" maxlength="2" inputmode="numeric" style="width:46px;text-align:center;" oninput="this.value=this.value.replace(/\D/g,'');if(this.value.length===2)document.getElementById('a-start-d').focus();" onblur="if(this.value.length===1)this.value='0'+this.value;">
              <span style="color:var(--text3);">-</span>
              <input type="text" id="a-start-d" placeholder="DD" maxlength="2" inputmode="numeric" style="width:46px;text-align:center;" oninput="this.value=this.value.replace(/\D/g,'');if(this.value.length===2)document.getElementById('a-end-m').focus();" onblur="if(this.value.length===1)this.value='0'+this.value;">
            </div>
          </div>
          <div class="fg"><label>출장 종료일 *</label>
            <div style="display:flex;align-items:center;gap:5px;">
              <span style="font-size:13px;font-weight:600;color:var(--text2);background:var(--surface2);padding:8px 11px;border-radius:8px;border:1px solid var(--border2);">2026</span>
              <span style="color:var(--text3);">-</span>
              <input type="text" id="a-end-m" placeholder="MM" maxlength="2" inputmode="numeric" style="width:46px;text-align:center;" oninput="this.value=this.value.replace(/\D/g,'');if(this.value.length===2)document.getElementById('a-end-d').focus();" onblur="if(this.value.length===1)this.value='0'+this.value;">
              <span style="color:var(--text3);">-</span>
              <input type="text" id="a-end-d" placeholder="DD" maxlength="2" inputmode="numeric" style="width:46px;text-align:center;" onblur="if(this.value.length===1)this.value='0'+this.value;">
            </div>
          </div>
          <div class="fg"><label>비용 청구 사업 *</label><select id="a-biz"></select></div>
          <div class="fg"><label>목적</label><input type="text" id="a-purpose" placeholder="미팅, 현장방문 등"></div>
        </div>
        <div class="sec">차량 구분</div>
        <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:9px 16px;">
            <input type="radio" name="vehicle" id="v-gov" value="관차" checked> 🚌 관차
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:9px 16px;">
            <input type="radio" name="vehicle" id="v-own" value="자차"> 🚗 자차
          </label>
        </div>
        <div class="sec">비용 입력 (원)</div>
        <div class="grid3" style="margin-bottom:12px;">
          <div class="fg"><label>💵 일비</label><input type="number" id="a-da" placeholder="0" min="0"></div>
          <div class="fg"><label>🍱 식비</label><input type="number" id="a-me" placeholder="0" min="0"></div>
          <div class="fg"><label>🚆 교통비</label><input type="number" id="a-tr" placeholder="0" min="0"></div>
        </div>
        <div class="fg" style="margin-bottom:16px;"><label>메모</label><input type="text" id="a-memo" placeholder="특이사항"></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="btn" onclick="addTrip()">✅ 등록하기</button>
          <span id="a-msg" class="msg"></span>
        </div>
      </div>
      <div id="tp-list" class="pane">
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7-CeYQ0MdGuHFI-dw_Ne3E3xcR9LHD74",
  authDomain: "trip-manager-fc684.firebaseapp.com",
  projectId: "trip-manager-fc684",
  storageBucket: "trip-manager-fc684.firebasestorage.app",
  messagingSenderId: "229407375560",
  appId: "1:229407375560:web:018dd31caf29f605e425fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// ── 데이터 ──
let myBiz={name:'',owner:'',budget:0};
let otherBiz=[];
let trips=[];
let tripNextId=100;
let events=[];
let schedNextId=200;
let curUser=null;
let unsub=null;
let curYear=new Date().getFullYear();
let curMonth=new Date().getMonth();
const GOAL_CONSULT=70,GOAL_PR=40,GOAL_FEE=30000000;

// ── 인증 ──
window.signIn=async function(){
  try{
    const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if(isMobile){await signInWithRedirect(auth,provider);}
    else{await signInWithPopup(auth,provider);}
  }catch(e){alert('로그인 실패: '+e.message);}
}
window.signOut=async function(){if(!confirm('로그아웃 하시겠어요?'))return;if(unsub)unsub();await fbSignOut(auth);}

// 리다이렉트 로그인 결과 처리
getRedirectResult(auth).catch(e=>{if(e.code!=='auth/no-current-user')console.error(e);});

onAuthStateChanged(auth,(user)=>{
  document.getElementById('loading-overlay').style.display='none';
  if(user){
    curUser=user;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    document.getElementById('user-name').textContent=user.displayName||user.email;
    if(user.photoURL){document.getElementById('user-avatar').src=user.photoURL;document.getElementById('user-avatar').style.display='block';}
    loadData(user.uid);
  } else {
    curUser=null;
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app-screen').style.display='none';
    if(unsub){unsub();unsub=null;}
  }
});

function loadData(uid){
  const ref=doc(db,'users',uid,'data','tripdata');
  setSyncStatus('ing','연결 중...');
  if(unsub)unsub();
  unsub=onSnapshot(ref,(snap)=>{
    if(snap.exists()){
      const d=snap.data();
      if(d.myBiz)myBiz=d.myBiz;
      if(d.otherBiz)otherBiz=d.otherBiz;
      if(d.trips)trips=d.trips;
      if(d.tripNextId)tripNextId=d.tripNextId;
      if(d.events)events=d.events;
      if(d.schedNextId)schedNextId=d.schedNextId;
    }
    setSyncStatus('ok','✓ 동기화됨');
    document.getElementById('topbar-biz').textContent=myBiz.name||'⚙️ 설정에서 사업명 등록';
    refreshCurrentView();
  },(err)=>{setSyncStatus('err','연결 오류');});
}

async function persist(){
  if(!curUser)return;
  setSyncStatus('ing','저장 중...');
  try{
    await setDoc(doc(db,'users',curUser.uid,'data','tripdata'),{myBiz,otherBiz,trips,tripNextId,events,schedNextId});
    setSyncStatus('ok','✓ 동기화됨');
  }catch(e){setSyncStatus('err','저장 실패');}
}

function setSyncStatus(t,txt){const el=document.getElementById('sync-status');el.className='sync-badge sync-'+t;el.textContent=txt;}

// ── 앱 전환 ──
window.switchApp=function(app){
  document.querySelectorAll('.app-tab').forEach((t,i)=>t.classList.toggle('on',['trip','sched'][i]===app));
  document.getElementById('app-trip').style.display=app==='trip'?'block':'none';
  document.getElementById('app-sched').style.display=app==='sched'?'block':'none';
  if(app==='trip')refreshTripView(currentTripTab);
  if(app==='sched')refreshSchedView(currentSchedTab);
}

let currentTripTab='dash';
let currentSchedTab='cal';

function refreshCurrentView(){
  refreshTripView(currentTripTab);
  if(currentSchedTab==='cal')renderCal();
}

// ── 출장 관리 ──
window.goTrip=function(id){
  currentTripTab=id;
  document.querySelectorAll('#app-trip .sub-tab').forEach((t,i)=>t.classList.toggle('on',['dash','monthly','setup','add','list','settle'][i]===id));
  document.querySelectorAll('#app-trip .pane').forEach(p=>p.classList.remove('on'));
  document.getElementById('tp-'+id).classList.add('on');
  refreshTripView(id);
}

function refreshTripView(id){
  if(id==='dash')renderDash();
  if(id==='monthly')renderMonthly();
  if(id==='setup')renderSetup();
  if(id==='add')populateAddBiz();
  if(id==='list')renderList();
  if(id==='settle')renderSettle();
}

function tTotal(t){return(t.da||0)+(t.me||0)+(t.tr||0);}
function fmt(n){return Math.round(n).toLocaleString()+'원';}
function shortBiz(id){
  if(id==='my'){const n=myBiz.name||'내 사업';return n.length>9?n.slice(0,9)+'…':n;}
  const b=otherBiz.find(x=>x.id===id);if(!b)return '?';
  return b.name.length>9?b.name.slice(0,9)+'…':b.name;
}
function bizLabel(id){
  if(id==='my')return myBiz.name||'내 사업';
  const b=otherBiz.find(x=>x.id===id);return b?b.name:'?';
}
function allBiz(){
  return [{id:'my',name:'[내 사업] '+(myBiz.name||'미설정')},...otherBiz.map(b=>({id:b.id,name:b.name+' ('+b.owner+')'}))];
}

function renderDash(){
  document.getElementById('d-banner').innerHTML=`<div class="banner">👤 <strong>${curUser?.displayName||''}</strong>${myBiz.name?' &nbsp;·&nbsp; '+myBiz.name:''}${myBiz.budget>0?' &nbsp;·&nbsp; 월 한도 '+fmt(myBiz.budget):''}</div>`;
  const pend=trips.filter(t=>t.status==='pending');
  const done=trips.filter(t=>t.status==='done');
  const tPend=pend.reduce((s,t)=>s+tTotal(t),0);
  const tDone=done.reduce((s,t)=>s+t.settled,0);
  document.getElementById('d-metrics').innerHTML=`
    <div class="mc"><div class="mc-lbl">전체 출장</div><div class="mc-val">${trips.length}건</div></div>
    <div class="mc"><div class="mc-lbl">미정산</div><div class="mc-val" style="color:var(--red);">${Math.round(tPend/10000)}만원</div><div class="mc-sub" style="color:var(--red);">${fmt(tPend)}</div><div class="mc-sub">${pend.length}건</div></div>
    <div class="mc"><div class="mc-lbl">정산 완료</div><div class="mc-val" style="color:var(--green);">${Math.round(tDone/10000)}만원</div><div class="mc-sub" style="color:var(--green);">${fmt(tDone)}</div><div class="mc-sub">${done.length}건</div></div>
    <div class="mc"><div class="mc-lbl">관차</div><div class="mc-val">${trips.filter(t=>t.vehicle==='관차').length}건</div></div>
    <div class="mc"><div class="mc-lbl">자차</div><div class="mc-val">${trips.filter(t=>t.vehicle==='자차').length}건</div></div>
  `;
  const myTrips=trips.filter(t=>t.bizId==='my');
  const used=myTrips.reduce((s,t)=>s+tTotal(t),0);
  if(myBiz.budget>0){
    const pct=Math.min(100,Math.round(used/myBiz.budget*100));
    const over=used>myBiz.budget;
    const color=over?'#e53935':pct>80?'#fb8c00':'#1976d2';
    document.getElementById('d-mybiz').innerHTML=`<div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px;">
        <span style="font-weight:600;font-size:13px;">${myBiz.name||'내 사업'}</span>
        <span style="font-size:12px;color:var(--text2);">${myTrips.length}건</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:5px;">
        <span>사용 ${fmt(used)}</span><span>한도 ${fmt(myBiz.budget)}</span>
      </div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px;">
        <span style="color:${over?'#c62828':'var(--text3)'};">${pct}%${over?' ⚠ 초과':''}</span>
        <span style="color:var(--text2);">잔액 ${fmt(Math.abs(myBiz.budget-used))}</span>
      </div>
    </div>`;
  } else {
    document.getElementById('d-mybiz').innerHTML=`<div style="color:var(--text3);font-size:13px;padding:8px 0;">설정 탭에서 월 예산 한도를 입력하면 사용률을 볼 수 있어요</div>`;
  }
  if(!pend.length){document.getElementById('d-pend').innerHTML='<div class="empty">✅ 미정산 출장이 없어요</div>';return;}
  document.getElementById('d-pend').innerHTML=`<div class="tbl-wrap"><table>
    <thead><tr><th>출장자</th><th>사업</th><th>차량</th><th>날짜</th><th>금액</th><th></th></tr></thead>
    <tbody>${pend.sort((a,b)=>a.start.localeCompare(b.start)).map(t=>`<tr>
      <td>${t.person}</td>
      <td><span class="badge b-mine">${shortBiz(t.bizId)}</span></td>
      <td><span class="badge ${t.vehicle==='관차'?'b-gov':'b-own'}">${t.vehicle||'-'}</span></td>
      <td style="font-size:11px;">${t.start.slice(5)}</td>
      <td style="font-weight:600;">${fmt(tTotal(t))}</td>
      <td><button class="btn-sm" style="padding:4px 10px;font-size:11px;" onclick="openSettle(${t.id})">정산</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function renderMonthly(){
  const bsel=document.getElementById('m-biz');
  const psel=document.getElementById('m-person');
  const bf=bsel.value,pf=psel.value;
  bsel.innerHTML='<option value="">전체 사업</option>'+allBiz().map(b=>`<option value="${b.id}">${bizLabel(b.id)}</option>`).join('');
  if(bf)bsel.value=bf;
  psel.innerHTML='<option value="">전체 출장자</option>'+[...new Set(trips.map(t=>t.person))].sort().map(p=>`<option value="${p}">${p}</option>`).join('');
  if(pf)psel.value=pf;
  let filtered=trips.filter(t=>(!bf||(bf==='my'?t.bizId==='my':t.bizId===parseInt(bf)))&&(!pf||t.person===pf));
  if(!filtered.length){document.getElementById('monthly-content').innerHTML='<div class="empty">출장 내역이 없어요</div>';return;}
  const months={};
  filtered.forEach(t=>{
    const m=t.start.slice(0,7);
    if(!months[m])months[m]={da:0,me:0,tr:0,total:0,count:0,pend:0,done:0,gov:0,own:0};
    months[m].da+=t.da||0;months[m].me+=t.me||0;months[m].tr+=t.tr||0;
    months[m].total+=tTotal(t);months[m].count++;
    if(t.status==='pending')months[m].pend++;else months[m].done++;
    if(t.vehicle==='관차')months[m].gov++;else months[m].own++;
  });
  const sm=Object.keys(months).sort().reverse();
  const gt=sm.reduce((s,m)=>s+months[m].total,0);
  let html=`<div class="card" style="margin-bottom:20px;background:var(--surface2);">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span style="font-weight:700;font-size:15px;">전체 합계</span>
      <span style="font-size:20px;font-weight:700;">${fmt(gt)}</span>
    </div>
    <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--text2);flex-wrap:wrap;">
      <span>총 ${filtered.length}건</span>
      <span>일비 ${fmt(sm.reduce((s,m)=>s+months[m].da,0))}</span>
      <span>식비 ${fmt(sm.reduce((s,m)=>s+months[m].me,0))}</span>
      <span>교통비 ${fmt(sm.reduce((s,m)=>s+months[m].tr,0))}</span>
    </div>
  </div><div class="month-summary-grid">`;
  sm.forEach(m=>{
    const d=months[m];const[y,mo]=m.split('-');
    html+=`<div class="month-card">
      <div class="month-card-hd"><span style="font-size:14px;font-weight:700;">${y}년 ${parseInt(mo)}월</span><span style="font-size:15px;font-weight:700;">${fmt(d.total)}</span></div>
      <div class="month-detail-row"><span>출장 건수</span><span>${d.count}건 (관차 ${d.gov}/자차 ${d.own})</span></div>
      <div class="month-detail-row"><span>💵 일비</span><span>${fmt(d.da)}</span></div>
      <div class="month-detail-row"><span>🍱 식비</span><span>${fmt(d.me)}</span></div>
      <div class="month-detail-row"><span>🚆 교통비</span><span>${fmt(d.tr)}</span></div>
      <hr class="divider">
      <div class="month-detail-row"><span>정산</span><span>
        ${d.pend>0?`<span class="badge b-pend" style="font-size:10px;">미정산 ${d.pend}</span> `:''}
        ${d.done>0?`<span class="badge b-done" style="font-size:10px;">완료 ${d.done}</span>`:''}
      </span></div>
    </div>`;
  });
  document.getElementById('monthly-content').innerHTML=html+'</div>';
}

function renderSetup(){
  const n=myBiz.name||'';
  document.getElementById('cur-mybiz-text').textContent=n?`${n}${myBiz.owner?' · '+myBiz.owner:''}${myBiz.budget>0?' · 한도 '+fmt(myBiz.budget):''}` :'내 사업 미설정';
  document.getElementById('mb-name').value=myBiz.name||'';
  document.getElementById('mb-owner').value=myBiz.owner||'';
  document.getElementById('mb-budget').value=myBiz.budget||'';

          <div style="font-size:11px;color:var(--text3);margin-top:3px;">${t.start}${t.end!==t.start?' ~ '+t.end:''} · 일비 ${(t.da||0).toLocaleString()} · 식비 ${(t.me||0).toLocaleString()} · 교통 ${(t.tr||0).toLocaleString()}${t.memo?' · '+t.memo:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span style="font-weight:700;font-size:14px;">${fmt(tTotal(t))}</span>
          <button class="btn-sm btn-blue" style="padding:4px 8px;font-size:11px;" onclick="openTripEdit(${t.id})">✏️</button>
          ${t.status==='done'?`<span class="badge b-done">✓ 완료 (${fmt(t.settled)})</span><button class="btn-sm btn-red" onclick="unSettle(${t.id});renderSettle();">취소</button>`:`<button class="btn-sm" onclick="openSettle(${t.id})">정산</button>`}
        </div>
      </div>`).join('')}
      <hr class="divider">
      <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--text2);">이번 달 합계</span><span style="font-weight:700;">${fmt(ttl)}</span></div>
    </div>`;
  }).join('');
}

window.exportTripCSV=function(){
  if(!trips.length){alert('출장 내역이 없어요.');return;}
  const months=[...new Set(trips.map(t=>t.start.slice(0,7)))].sort();

    <div style="display:flex;gap:8px;"><button class="btn" onclick="doExportTripCSV()">📥 내보내기</button><button class="btn-sm" onclick="closeModal()">취소</button></div>
  </div>`;
  document.getElementById('modal-wrap').style.display='flex';
  function upd(){const mf=document.getElementById('ex-month').value,pf=document.getElementById('ex-person').value,bf=document.getElementById('ex-biz').value;const cnt=trips.filter(t=>(!mf||t.start.startsWith(mf))&&(!pf||t.person===pf)&&(!bf||(bf==='my'?t.bizId==='my':t.bizId===parseInt(bf)))).length;document.getElementById('ex-count').textContent=`→ ${cnt}건`;}
  setTimeout(()=>{['ex-month','ex-person','ex-biz'].forEach(id=>document.getElementById(id).addEventListener('change',upd));upd();},50);

window.doExportTripCSV=function(){
  const mf=document.getElementById('ex-month').value,pf=document.getElementById('ex-person').value,bf=document.getElementById('ex-biz').value;
  function fd(d){if(!d)return '';const p=d.split('-');return p[0].slice(2)+'-'+p[1]+'-'+p[2];}
  function fb(id){if(id==='my'){const n=myBiz.name||'';if(n.includes('소통공간'))return '소통공간';return n;}const b=otherBiz.find(x=>x.id===id);return b?b.name:'';}
  let filtered=[...trips].filter(t=>(!mf||t.start.startsWith(mf))&&(!pf||t.person===pf)&&(!bf||(bf==='my'?t.bizId==='my':t.bizId===parseInt(bf)))).sort((a,b)=>a.start.localeCompare(b.start));
  if(!filtered.length){alert('해당 조건의 내역이 없어요.');return;}
  const BOM='\uFEFF';
  const header=['출장구분','사업비','출장시작일자','출장종료일자','출장지','목적','일비','식비','교통비','합계'];
  const rows=filtered.map(t=>['국내/관외',fb(t.bizId),fd(t.start),fd(t.end),t.dest,t.purpose||'',t.da||0,t.me||0,t.tr||0,tTotal(t)].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv=BOM+[header.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  let fname='출장비내역';if(mf){const[y,mo]=mf.split('-');fname+=`_${y.slice(2)}년${parseInt(mo)}월`;}if(pf)fname+=`_${pf}`;
  a.download=`${fname}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);closeModal();
}

function catColor(c){
  if(c==='상담')return{bg:'#DCFCE7',color:'#166534'};
  if(c==='홍보')return{bg:'#F3E8FF',color:'#7E22CE'};
  return{bg:'#F2F0EC',color:'#6B6560'};
}
function catClass(c){if(c==='상담')return 'b-consult';if(c==='홍보')return 'b-pr';return 'b-other2';}
function statusClass(s){if(s==='계획')return 'b-plan';if(s==='확정')return 'b-confirm';return 'b-sdone';}
function seqLabel(s){return s?s+'차':'-';}
function calcHours(t){if(!t)return null;const m=t.match(/(\d{1,2}):(\d{2})\s*[~\-]\s*(\d{1,2}):(\d{2})/);if(!m)return null;const diff=(parseInt(m[3])*60+parseInt(m[4]))-(parseInt(m[1])*60+parseInt(m[2]));return diff>0?diff/60:null;}
function lecText(lecs){if(!lecs||!lecs.length)return '-';return lecs.map(l=>l.name).join(', ');}
function fmtDateSched(d){if(!d)return '';const p=d.split('-');return p[0].slice(2)+'-'+p[1]+'-'+p[2];}

function renderCal(){
  document.getElementById('cal-title').textContent=`${curYear}년 ${curMonth+1}월`;
  const grid=document.getElementById('cal-grid');grid.innerHTML='';
  const first=new Date(curYear,curMonth,1).getDay();
  const last=new Date(curYear,curMonth+1,0).getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  for(let i=0;i<first;i++){const pm=new Date(curYear,curMonth,0-(first-1-i));grid.appendChild(makeCalCell(pm.getFullYear(),pm.getMonth(),pm.getDate(),true,null));}
  for(let d=1;d<=last;d++){
    const dateStr=`${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=(first+d-1)%7;
    const cell=makeCalCell(curYear,curMonth,d,false,dateStr);
    if(dateStr===todayStr)cell.classList.add('today');
    if(dow===0)cell.classList.add('is-sun');if(dow===6)cell.classList.add('is-sat');
    const dayEvs=events.filter(e=>e.date===dateStr).sort((a,b)=>a.cat.localeCompare(b.cat));
    dayEvs.slice(0,3).forEach(ev=>{
      const col=catColor(ev.cat);const isDone=ev.status==='완료';
      const tag=document.createElement('div');tag.className='cal-event';
      tag.style.background=isDone?'#E8F5E9':col.bg;tag.style.color=isDone?'#166534':col.color;
      tag.innerHTML=(ev.hasBus?'<span style="font-size:9px;">🚌</span>':'')+'<span style="overflow:hidden;text-overflow:ellipsis;">'+ev.place+'</span>';
      tag.onclick=(e)=>{e.stopPropagation();openSchedDetail(ev.id);};cell.appendChild(tag);
    });
    if(dayEvs.length>3){const more=document.createElement('div');more.className='cal-more';more.textContent=`+${dayEvs.length-3}개`;cell.appendChild(more);}
    grid.appendChild(cell);
  }
  const remain=42-(first+last);
  for(let d=1;d<=remain;d++)grid.appendChild(makeCalCell(curYear,curMonth+1,d,true,null));
}
function makeCalCell(y,m,d,other,dateStr){
  const cell=document.createElement('div');cell.className='cal-cell'+(other?' other-month':'');
  const el=document.createElement('div');el.className='cal-date';el.textContent=d;cell.appendChild(el);
  if(!other&&dateStr){cell.onclick=()=>{openSchedAddModal();document.getElementById('f-mon').value=dateStr.slice(5,7);document.getElementById('f-day').value=dateStr.slice(8,10);};}
  return cell;
}
window.moveMonth=function(dir){curMonth+=dir;if(curMonth<0){curMonth=11;curYear--;}if(curMonth>11){curMonth=0;curYear++;}renderCal();}

window.saveSchedForm=async function(){

  const date=`2026-${mo}-${dy}`;
  const timeVal=document.getElementById('f-time').value.trim();
  const hours=calcHours(timeVal);
  const id=parseInt(document.getElementById('f-id').value)||null;
  const obj={
    id:id||schedNextId++,date,
    seq:parseInt(document.getElementById('f-seq').value)||null,
    cat:document.getElementById('f-cat').value,
    status:document.getElementById('f-status').value,
    hasBus:document.getElementById('f-bus').checked,
    place,count:parseInt(document.getElementById('f-count').value)||0,
    time:timeVal,hours,desc:document.getElementById('f-desc').value.trim(),

    lecturers:getLecs(),memo:document.getElementById('f-memo').value.trim(),

  if(currentSchedTab==='stat')renderSchedStat();

window.exportSchedCSV=function(){
  if(!events.length){alert('일정이 없어요');return;}
  const BOM='\uFEFF';
  const header=['연번','회차','구분','버스운행','일자','장소','인원','내용','운영시간','시간(h)','협업기관','담당자','강사명','상태','메모'];
  const rows=[...events].sort((a,b)=>a.date.localeCompare(b.date)).map((e,i)=>[i+1,e.seq?e.seq+'차':'',e.cat,e.hasBus?'O':'',fmtDateSched(e.date),e.place,e.count||'',e.desc||'',e.time||'',e.hours||'',e.org||'',e.manager||'',e.lecturers&&e.lecturers.length?e.lecturers.map(l=>l.name).join('/'):'-',e.status,e.memo||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv=BOM+[header.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`일자리버스_일정_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);
}

window.loadSchedData=async function(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(ev){
    try{const d=JSON.parse(ev.target.result);if(d.events)events=d.events;if(d.schedNextId)schedNextId=d.schedNextId;await persist();renderCal();alert('✅ 복원 완료!');}
    catch(err){alert('❌ 파일 오류');}
  };reader.readAsText(file);e.target.value='';
}

// ── 공통 모달 ──
window.closeModal=function(){document.getElementById('modal-wrap').style.display='none';}
document.getElementById('modal-wrap').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('modal-sched').addEventListener('click',function(e){if(e.target===this)this.style.display='none';});

function showMsg(id,txt,type){const el=document.getElementById(id);if(!el)return;el.textContent=txt;el.className='msg '+type;setTimeout(()=>{el.textContent='';},2500);}
</script>

<!-- 일정 등록/수정 모달 (별도) -->
<div class="modal-bg" id="modal-sched">
  <div class="modal-box">
    <div class="modal-title" id="form-title" style="font-weight:700;font-size:16px;margin-bottom:18px;">📅 일정 등록</div>
    <input type="hidden" id="f-id">
    <div class="sec" style="margin-top:0;">기본 정보</div>
    <div class="grid3">
      <div class="fg"><label>일자 * <span style="font-size:11px;color:var(--text3);">(월-일)</span></label>
        <div style="display:flex;align-items:center;gap:4px;">
          <span style="font-size:13px;font-weight:600;color:var(--text2);background:var(--surface2);padding:8px 10px;border-radius:8px;border:1px solid var(--border2);">2026</span>
          <span style="color:var(--text3);">-</span>
          <input type="text" id="f-mon" placeholder="MM" maxlength="2" inputmode="numeric" style="width:44px;text-align:center;" oninput="this.value=this.value.replace(/\D/g,'');if(this.value.length===2)document.getElementById('f-day').focus();" onblur="if(this.value.length===1)this.value='0'+this.value;">
          <span style="color:var(--text3);">-</span>
          <input type="text" id="f-day" placeholder="DD" maxlength="2" inputmode="numeric" style="width:44px;text-align:center;" onblur="if(this.value.length===1)this.value='0'+this.value;">
        </div>
      </div>
      <div class="fg"><label>구분 *</label>
        <select id="f-cat"><option value="상담">💬 상담</option><option value="홍보">📢 홍보</option><option value="기타">📌 기타</option></select>
      </div>
      <div class="fg"><label>상태</label>
        <select id="f-status"><option value="계획">계획</option><option value="확정">확정</option><option value="완료">완료</option></select>
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--blue-bg);border:1px solid #9DC4F5;border-radius:8px;cursor:pointer;margin-bottom:12px;">
      <input type="checkbox" id="f-bus" style="width:16px;height:16px;accent-color:var(--blue);">
      <span style="font-size:13px;font-weight:500;color:var(--blue);">🚌 버스 운행</span>
    </label>
    <div class="grid2">
      <div class="fg"><label>회차 <span style="font-size:11px;color:var(--text3);">(숫자만)</span></label><input type="number" id="f-seq" placeholder="예: 3 → 3차" min="1"></div>
      <div class="fg"><label>장소 *</label><input type="text" id="f-place" placeholder="장소명 입력"></div>
      <div class="fg"><label>인원</label><input type="number" id="f-count" placeholder="0" min="0"></div>
      <div class="fg"><label>운영시간</label>
        <input type="text" id="f-time" placeholder="예: 10:00~12:00" oninput="calcTime()">
        <div class="time-calc" id="time-result"></div>
      </div>
    </div>
    <div class="fg"><label>내용(목적)</label><input type="text" id="f-desc" placeholder="프로그램 내용"></div>
    <hr class="divider">
    <div class="sec">협업 기관</div>
    <div class="grid2">
      <div class="fg"><label>협업기관</label><input type="text" id="f-org" placeholder="기관명"></div>
      <div class="fg"><label>담당자</label><input type="text" id="f-manager" placeholder="담당자명"></div>
    </div>
    <hr class="divider">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <div class="sec" style="margin:0;">강사 정보</div>
      <button type="button" class="btn-sm btn-green" onclick="addLecRow()">➕ 강사 추가</button>
    </div>
    <div id="lecturer-list"></div>
    <hr class="divider">
    <div class="fg"><label>메모/비고</label><textarea id="f-memo" placeholder="특이사항, 비고"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:4px;align-items:center;">
      <button class="btn" onclick="saveSchedForm()">💾 저장</button>
      <button class="btn-sm" onclick="document.getElementById('modal-sched').style.display='none'">취소</button>
      <span id="f-msg" class="msg"></span>
    </div>
  </div>
</div>

</body>
</html>
